name: Build IPA

# Builds an unsigned app on a cloud Mac, fakesigns it for TrollStore,
# and publishes Mappledown.ipa to the "latest" release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-test:
    name: Test the Markdown and math renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Render the math stress test
        run: |
          node scripts/preview-test.js > result.json
          cat result.json
          node -e "const r=require('./result.json'); if (r.errors.length !== 1) { console.error('Expected exactly 1 deliberate math error, got', r.errors); process.exit(1) }"

  build:
    name: Build Mappledown.ipa
    runs-on: macos-15
    needs: preview-test
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Mappledown.xcodeproj \
            -scheme Mappledown \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Errors"; grep -E "error:|error\b" build.log | head -80; echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: Fakesign and package
        run: |
          APP=build/Build/Products/Release-iphoneos/Mappledown.app
          ldid -SMappledown/Mappledown.entitlements "$APP/Mappledown"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Mappledown.ipa Payload
          ls -lh Mappledown.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mappledown-ipa
          path: Mappledown.ipa

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mappledown.ipa \
            --target "$GITHUB_SHA" \
            --title "Mappledown (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download Mappledown.ipa on your iPad and open it with TrollStore."
